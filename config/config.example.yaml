# Potion Perps Bot — Configuration
# Copy to config.yaml and customize. Secrets go in .env (not here).

# --- Signal input ---
input:
  adapter: simulation              # simulation | cli | file | discord | telegram_channel
  signals_dir: signals/incoming/   # file adapter drop zone
  simulation_dir: signals/samples/ # replay directory for simulation adapter
  simulation_delay_sec: 5          # seconds between replayed signals
  # Shadow mode: capture every Discord message verbatim to disk, NO trades.
  # When true, only the Discord adapter + capture sink run; no orchestrator,
  # no Telegram bot, no admin API. Used to grow a sample corpus from CP's
  # channel during parser development.
  shadow_mode: false
  captures_dir: signals/captures/  # shadow-mode archive destination

# --- Hyperliquid exchange ---
# Credentials are in .env (HL_ACCOUNT_ADDRESS, HL_API_WALLET, HL_API_SECRET)
exchange:
  network: testnet                 # testnet | mainnet

# --- Strategy presets ---
# A "strategy" is just 3 settings: TP management, SL management, position
# sizing. Names mirror CryptoPrinter's weekly report rows so a per-user
# report lines up directly with CP's. Define your own presets here to
# override built-ins with the same name.
strategy_presets:
  my_strategy:                     # your custom preset
    tp_split: [0.5, 0.3, 0.2]     # % of position to close at TP1, TP2, TP3
    move_sl_to_breakeven_after: tp1  # tp1 | tp2 | never
    size_pct: 1.5                  # fallback size %, used only if size_by_risk lacks the level

# Built-in presets (no need to redefine unless you want to override):
#   tp1_only:    tp_split [1.0, 0, 0],         no BE,        2% size
#   tp2_only:    tp_split [0, 1.0, 0],         no BE,        2% size
#   tp3_only:    tp_split [0, 0, 1.0],         no BE,        2% size
#   tp2_be:      tp_split [0, 1.0, 0],         BE after TP1, 2% size
#   tp3_be:      tp_split [0, 0, 1.0],         BE after TP1, 2% size
#   hybrid:      tp_split [0.1, 0.7, 0.2],     BE after TP1, 2% size
#   even_split:  tp_split [0.33, 0.33, 0.34],  BE after TP1, 2% size  (default)

# --- Strategy selection ---
strategy:
  active_preset: even_split        # which preset to use (built-in or custom)
  auto_execute: false              # true = execute immediately, false = wait for confirmation
  max_leverage: 0                  # 0 = uncapped (follow CP, clamp to exchange max); >=1 = personal cap
  size_by_risk:                    # override preset size_pct per risk level
    LOW: 4.0
    MEDIUM: 2.0
    HIGH: 1.0

# --- Risk management ---
risk:
  max_open_positions: 10           # max concurrent trades
  max_daily_loss_pct: 10.0         # circuit breaker: stop trading if daily loss exceeds this %
  max_position_size_usd: 500       # absolute max USD per single position
  max_total_exposure_usd: 2000     # max total USD across all open positions combined
  min_order_usd: 10.0              # Hyperliquid minimum order value
  # Mainnet promotion gate (Phase 3.5). When a mainnet user has
  # auto_execute=ON and a trade's sized position exceeds this threshold,
  # the trade is held PENDING with Approve/Reject buttons in Telegram
  # instead of being submitted automatically. Testnet trades are never
  # gated. The timeout below is how long the bot waits for a response
  # before auto-declining the trade.
  mainnet_confirm_above_usd: 100.0
  mainnet_confirm_timeout_min: 5

# --- State persistence ---
database:
  path: data/trades.db             # SQLite database path

# --- Daily SQLite backups (D9) ---
# Uses the SQLite online backup API — concurrent writers are not blocked.
# Backups land on the same disk as the DB. For real DR, add an offsite
# rsync/scp step (deferred to Phase 5).
backups:
  enabled: true
  directory: backups               # destination dir (relative or absolute)
  retention_days: 30               # files older than this are pruned
  daily_at_utc: "06:00"            # HH:MM, UTC. No DST surprises.

# --- Logging ---
logging:
  level: INFO                      # DEBUG | INFO | WARNING | ERROR
  file: logs/bot.log               # log file path (rotates: 10 MB × 5 backups)
  # Per-library overrides applied on top of the root level. Keeps chatty
  # third-party libraries from drowning the bot's own trade events. These
  # are ALSO the in-code defaults (LoggingConfig._default_logger_levels) —
  # omit this block to accept them as-is. If you uncomment it, your keys
  # replace the defaults wholesale; merging is not performed.
  # loggers:
  #   httpx: WARNING
  #   httpcore: WARNING
  #   urllib3: WARNING
  #   discord: INFO
  #   discord.gateway: WARNING     # quiet the heartbeat noise
  #   telegram: INFO
  #   aiohttp.access: WARNING      # admin / health endpoint request log
  #   asyncio: WARNING

# --- Discord (Phase 4) ---
# Bot token is in .env (DISCORD_BOT_TOKEN)
discord:
  channel_id: ""                   # Discord channel to monitor
  source_bot_name: "Potion Perps"  # name of the signal bot to listen to

# --- Telegram bot ---
# Bot token + admin IDs come from .env (TELEGRAM_BOT_TOKEN, TELEGRAM_ADMIN_IDS).
# signals_channel_id is non-secret config: when ``input.adapter: telegram_channel``,
# the bot listens for posts in this private channel and dispatches them through
# the pipeline. One-time setup:
#   1. Create a private Telegram channel
#   2. Add the bot as admin with "Post Messages" + read permissions
#   3. Post any message in the channel, forward to @userinfobot, copy the
#      numeric chat_id (typically of the form -100xxxxxxxxxx)
telegram:
  signals_channel_id:              # e.g. -1001234567890
